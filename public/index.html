<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeAdmin – Avtal & abonnemang</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header>
        <h1>LifeAdmin</h1>
    </header>

    <main>
        <h2>Avtal & abonnemang</h2>

        <section>
            <h3>Registrera avtal</h3>


            <form id="agreement-form">
                <div class="form-row">
                    <div>
                        <label for="agreement-name">Avtalsnamn</label>
                        <input type="text" id="agreement-name" name="name" required>
                    </div>

                    <div>
                        <label for="monthly-cost">Månadskostnad</label>
                        <input type="number" id="monthly-cost" name="monthlyCost" min="0.01" step="0.01" required>
                    </div>
                </div>

                <label for="reference-number">Referensnummer</label>
                <input type="text" id="reference-number" name="referenceNumber" required>

                <label for="description">Beskrivning</label>
                <textarea id="description" name="description" required></textarea>

                <button type="submit">Lägg till avtal</button>
            </form>

        </section>

        <section>
            <h3>Mina avtal och abonnemang</h3>

            <table>
                <thead>
                    <tr>
                        <th>Namn</th>
                        <th>Referens</th>
                        <th>Månadskostnad</th>
                        <th>Åtgärd</th>
                    </tr>
                </thead>

                <tbody id="agreements-table">

                </tbody>
            </table>
        </section>

    </main>

</body>

</html>
